<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C6A66B"/>
      <stop offset="100%" stop-color="#9E782F"/>
    </linearGradient>
    <linearGradient id="logoEm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B52"/>
      <stop offset="100%" stop-color="#243A32"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(4, 5)">
    <circle cx="30" cy="30" r="28" fill="url(#logoEm)"/>
    <circle cx="30" cy="30" r="26" fill="none" stroke="url(#logoGold)" stroke-width="1.5"/>
    <!-- Organic Leaf / Diamond -->
    <path d="M30 12 C33 22, 40 26, 44 30 C38 30, 33 26, 30 12 Z" fill="#287FA0" opacity="0.9"/>
    <path d="M30 12 C27 22, 20 26, 16 30 C22 30, 27 26, 30 12 Z" fill="url(#logoGold)" opacity="0.95"/>
    <!-- Initials TP -->
    <text x="21" y="44" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="url(#logoGold)">T</text>
    <text x="32" y="44" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F7F5ED">P</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 16)">
    <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700" letter-spacing="1.2" fill="#176B52">
      NGUYỄN THỊ TRÚC PHƯƠNG
    </text>
    <text x="1" y="38" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2.8" fill="#C6A66B">
      THẠCH LỰU MỘC • TÂN DẬU 1981
    </text>
  </g>
</svg>
