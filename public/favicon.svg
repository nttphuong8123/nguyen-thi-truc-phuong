<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B52"/>
      <stop offset="100%" stop-color="#243A32"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE094"/>
      <stop offset="50%" stop-color="#C6A66B"/>
      <stop offset="100%" stop-color="#8F7038"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="64" cy="64" r="60" fill="url(#favBg)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#favGold)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#C6A66B" stroke-width="0.75" stroke-dasharray="2,3"/>

  <!-- Pomegranate Leaf / Stone Vine Motif (Thạch Lựu Mộc) -->
  <path d="M64 22 C68 35, 78 40, 84 46 C76 46, 68 40, 64 22 Z" fill="#287FA0" opacity="0.8"/>
  <path d="M64 22 C60 35, 50 40, 44 46 C52 46, 60 40, 64 22 Z" fill="url(#favGold)" opacity="0.9"/>

  <!-- Monogram TP (Trúc Phương) -->
  <g filter="url(#glow)">
    <!-- Letter T -->
    <path d="M42 48 H68 M55 48 V86" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Letter P -->
    <path d="M66 52 H78 C86 52, 90 58, 90 66 C90 74, 86 80, 78 80 H66 V90" stroke="#F7F5ED" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Small diamond accent at bottom -->
  <polygon points="64,98 67,102 64,106 61,102" fill="url(#favGold)"/>
</svg>
