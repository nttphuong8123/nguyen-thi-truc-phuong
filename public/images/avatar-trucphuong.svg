<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EFE9"/>
      <stop offset="60%" stop-color="#F7F5ED"/>
      <stop offset="100%" stop-color="#DDE6DE"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B52"/>
      <stop offset="100%" stop-color="#287FA0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE094"/>
      <stop offset="50%" stop-color="#C6A66B"/>
      <stop offset="100%" stop-color="#8F7038"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B52"/>
      <stop offset="60%" stop-color="#12513E"/>
      <stop offset="100%" stop-color="#0E3A2D"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#243A32" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" rx="32" fill="url(#bgGrad)"/>

  <!-- Decorative Architectural Arch & Botanical Motifs -->
  <path d="M70 700 V320 C70 170, 200 60, 300 60 C400 60, 530 170, 530 320 V700 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M90 700 V330 C90 190, 210 90, 300 90 C390 90, 510 190, 510 330 V700 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Botanical Thạch Lựu Leaves in Background -->
  <g opacity="0.35">
    <path d="M120 280 C100 200, 160 160, 220 180 C180 240, 140 260, 120 280 Z" fill="url(#leafGrad)"/>
    <path d="M480 300 C500 220, 440 180, 380 200 C420 260, 460 280, 480 300 Z" fill="url(#leafGrad)"/>
    <circle cx="210" cy="180" r="14" fill="#C6A66B"/>
    <circle cx="390" cy="200" r="14" fill="#287FA0"/>
  </g>

  <!-- Portrait Figure Group -->
  <g filter="url(#softShadow)">
    <!-- Silk / Blazer Suit -->
    <path d="M150 700 C150 560, 200 480, 300 470 C400 480, 450 560, 450 700 Z" fill="url(#suitGrad)"/>
    <!-- Lapels -->
    <path d="M250 480 L300 600 L230 700" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M350 480 L300 600 L370 700" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Inner Silk Blouse -->
    <polygon points="300,520 280,600 320,600" fill="#F7F5ED"/>
    <!-- Gold Pendant Necklace -->
    <path d="M282 450 Q300 490 318 450" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <polygon points="300,488 306,498 300,506 294,498" fill="url(#goldGrad)"/>

    <!-- Neck -->
    <rect x="282" y="380" width="36" height="80" rx="10" fill="#F4D8C4"/>

    <!-- Face Silhouette / Contours -->
    <ellipse cx="300" cy="340" rx="65" ry="85" fill="#FCE9DC"/>

    <!-- Hair (Elegant chic updo / flowing wave) -->
    <path d="M225 330 C220 240, 250 180, 300 180 C350 180, 380 240, 375 330 C370 360, 385 410, 380 440 C360 410, 365 350, 360 320 C350 250, 250 250, 240 320 C235 350, 240 410, 220 440 C215 410, 230 360, 225 330 Z" fill="#243A32"/>
    
    <!-- Hair bun / top wave -->
    <ellipse cx="300" cy="195" rx="55" ry="30" fill="#1B2E28"/>

    <!-- Eyes, brows, gentle warm smile -->
    <!-- Brows -->
    <path d="M260 315 Q275 308 288 314" fill="none" stroke="#3A2820" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M312 314 Q325 308 340 315" fill="none" stroke="#3A2820" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes with warm confidence -->
    <path d="M262 330 Q275 324 286 330" fill="none" stroke="#243A32" stroke-width="3" stroke-linecap="round"/>
    <path d="M314 330 Q325 324 338 330" fill="none" stroke="#243A32" stroke-width="3" stroke-linecap="round"/>
    <!-- Nose line subtle -->
    <path d="M298 335 L296 355 L303 358" fill="none" stroke="#E0BBA2" stroke-width="2" stroke-linecap="round"/>
    <!-- Lips - Elegant rose red -->
    <path d="M285 380 Q300 376 315 380 Q300 392 285 380 Z" fill="#C25953"/>
    
    <!-- Pearl / Jade Earrings -->
    <circle cx="232" cy="355" r="7" fill="url(#goldGrad)"/>
    <circle cx="232" cy="368" r="9" fill="#176B52"/>
    <circle cx="368" cy="355" r="7" fill="url(#goldGrad)"/>
    <circle cx="368" cy="368" r="9" fill="#176B52"/>
  </g>

  <!-- Luxury Badge Overlay at Bottom Left -->
  <g transform="translate(60, 570)">
    <rect width="210" height="74" rx="16" fill="rgba(247, 245, 237, 0.95)" stroke="#C6A66B" stroke-width="1.5"/>
    <circle cx="36" cy="37" r="18" fill="#176B52"/>
    <text x="30" y="43" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#FFE094">TP</text>
    <text x="68" y="32" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#243A32">Trúc Phương</text>
    <text x="68" y="50" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="600" fill="#C6A66B" letter-spacing="1">THẠCH LỰU MỘC</text>
  </g>
</svg>
