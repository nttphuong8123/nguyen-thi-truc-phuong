  <rect width="1200" height="630" fill="url(#ogBg)" />
  <circle cx="200" cy="150" r="280" fill="#087FE5" opacity="0.2" filter="blur(80px)" />
  <circle cx="1050" cy="480" r="320" fill="#20C5E8" opacity="0.16" filter="blur(90px)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" />

  <!-- Standalone Brand Logo TP -->
  <g transform="translate(80, 80)">
    <circle cx="65" cy="65" r="63" fill="#FFF9EC" stroke="#F2C45D" stroke-width="4" />
    <image href="/images/logo-tp.png" x="12" y="12" width="106" height="106" preserveAspectRatio="xMidYMid meet" />
  </g>

  <text x="240" y="135" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#E8EDF5" letter-spacing="1">NGUYỄN THỊ TRÚC PHƯƠNG</text>
  <text x="240" y="175" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="16" font-weight="700" fill="#F2C45D" letter-spacing="2">CỔNG HỌC TẬP — TRI THỨC SỐ HCE</text>

  <text x="100" y="320" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
    CHIA SẺ VÀ KẾT NỐI TRI THỨC
  </text>
  <text x="100" y="380" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="22" font-weight="500" fill="#E8EDF5">
    Hệ thống học liệu mở 8 môn chuyên ngành • Ngân hàng đề thi trắc nghiệm • Hướng dẫn SPSS & NCKH
  </text>

  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="260" height="52" rx="14" fill="#092B61" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="130" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" fill="#E8EDF5" text-anchor="middle">📚 8 Học Phần Chuyên Sâu</text>

    <rect x="280" y="0" width="240" height="52" rx="14" fill="#087FE5" stroke="#7DD3FC" stroke-opacity="0.7" stroke-width="1.5" />
    <text x="400" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ Thi Online Bấm Giờ</text>

    <rect x="540" y="0" width="220" height="52" rx="14" fill="#092B61" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="650" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" fill="#E8EDF5" text-anchor="middle">📊 Phân Tích Dữ Liệu SPSS</text>
