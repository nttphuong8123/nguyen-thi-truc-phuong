      <stop offset="58%" stop-color="#E2E8F0" />
      <stop offset="86%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="anCyanBlue" x1="18%" y1="12%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#56CFE1" />
      <stop offset="36%" stop-color="#38BDF8" />
      <stop offset="72%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#3F51B5" />
    </linearGradient>
    <radialGradient id="anRightFootGlow" cx="35%" cy="20%" r="70%">
