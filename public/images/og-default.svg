      <stop offset="50%" stop-color="#64748B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="anSilverWave" x1="0%" y1="15%" x2="100%" y2="95%">
