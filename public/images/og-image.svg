<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B52"/>
      <stop offset="60%" stop-color="#243A32"/>
      <stop offset="100%" stop-color="#10201A"/>
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A3"/>
      <stop offset="50%" stop-color="#C6A66B"/>
      <stop offset="100%" stop-color="#8F7038"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Decorative Circles -->
  <circle cx="1100" cy="150" r="300" fill="#287FA0" opacity="0.12"/>
  <circle cx="200" cy="550" r="240" fill="#C6A66B" opacity="0.08"/>

  <!-- Border Inner Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="url(#ogGold)" stroke-width="2" opacity="0.6"/>

  <!-- Left Content -->
  <g transform="translate(100, 140)">
    <!-- Subtitle Badge -->
    <rect width="280" height="36" rx="18" fill="rgba(198, 166, 107, 0.2)" stroke="#C6A66B" stroke-width="1"/>
    <text x="140" y="24" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#FFE5A3" text-anchor="middle" letter-spacing="2">
      TÂN DẬU 1981 • THẠCH LỰU MỘC
    </text>

    <!-- Main Name Title -->
    <text x="0" y="110" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="#F7F5ED">
      NGUYỄN THỊ TRÚC PHƯƠNG
    </text>

    <!-- Tagline -->
    <text x="0" y="170" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="24" fill="#C6A66B">
      "Bền bỉ như mộc trên đá, thanh tao giữa dòng đời vạn biến."
    </text>

    <!-- Brief Description -->
    <text x="0" y="230" font-family="'Be Vietnam Pro', sans-serif" font-size="18" fill="#E8EFE9" opacity="0.9">
      Chân dung, triết lý nhân sinh, hành trình quản trị và những giá trị phụng sự cộng đồng.
    </text>

    <!-- URL Tag -->
    <g transform="translate(0, 300)">
      <rect width="360" height="46" rx="8" fill="#287FA0" opacity="0.9"/>
      <text x="180" y="29" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        nguyenthitrucphuong.pages.dev
      </text>
    </g>
  </g>

  <!-- Right Decorative Monogram Emblem -->
  <g transform="translate(900, 315)">
    <circle cx="0" cy="0" r="140" fill="rgba(247, 245, 237, 0.05)" stroke="url(#ogGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="rgba(23, 107, 82, 0.6)" stroke="#C6A66B" stroke-width="1"/>
    <text x="0" y="25" font-family="'Playfair Display', Georgia, serif" font-size="90" font-weight="700" fill="url(#ogGold)" text-anchor="middle">TP</text>
  </g>
</svg>
